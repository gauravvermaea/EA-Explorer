# EA Explorer's database in certificate mode (R6-C1, D743): every service signs in with its own certificate, issued by
# EA Explorer's own authority; no password crosses the network but the database superuser's. Plain (non-TLS)
# connections are refused.
# TYPE    DATABASE     USER            ADDRESS   METHOD
# inside the db container: the way back in when everything else fails (docker exec, no network login)
local     all          all                       trust
# the database superuser (backups, maintenance, a database's own creation): its password, over TLS only
hostssl   all          postgres        samenet   scram-sha-256
# the standby's replication login (phase 36.3), over TLS only
hostssl   replication  eax_replicator  samenet   scram-sha-256
hostssl   replication  eax_replicator  all       scram-sha-256
# every other login: the service's certificate, its name mapped to the logins it may use (pg_ident.conf), checked
# against the authority and its revocation list
hostssl   all          all             samenet   cert map=eax
