# What SonarQube scans (Release 8, R8; D740, D792): eax test sonar runs the scanner over the repository with these.
# The whole code base: the API, the ops helpers, eaxcli, the testbench, the screens' JavaScript, the tools and the
# scripts. Left out: what is made or downloaded (node_modules, dist, the built website, the PDFs), the data and logs,
# and third-party code kept here as it came.
sonar.projectKey=ea-explorer
sonar.projectName=EA Explorer
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=services/api/tests,services/web/tests,deploy/drawio/tests
sonar.test.inclusions=services/api/tests/**,services/web/tests/**,deploy/drawio/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,work/**,logs/**,persist/**,documents/**,services/web/public/site/**,docs/site/shots/**,testbench/data/**,**/*.pdf,**/*.png,**/*.jpg,**/*.svg,**/*.xlsx,**/*.docx,**/*.pptx,**/*.zip,**/*.min.js,services/api/tests/**,services/web/tests/**,deploy/drawio/tests/**
sonar.python.version=3.12
sonar.scm.disabled=true
